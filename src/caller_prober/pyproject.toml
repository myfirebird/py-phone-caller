[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caller-prober"
version = "1.0.0"
description = "Scheduled number probing and duty-group alarm routing engine for py-phone-caller"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "py_phone_caller_utils",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "PyYAML>=6.0",
    "croniter>=2.0.0",
]

[tool.setuptools.package-dir]
caller_prober = "."

[tool.setuptools.package-data]
caller_prober = ["*"]
